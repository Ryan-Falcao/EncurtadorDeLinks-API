services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: encurtador
      POSTGRES_USER: encurtador
      POSTGRES_PASSWORD: encurtador_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encurtador -d encurtador"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./encurtador-url
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/encurtador
      SPRING_DATASOURCE_USERNAME: encurtador
      SPRING_DATASOURCE_PASSWORD: encurtador_local
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Senha apenas para testar o painel no seu computador.
      APP_ADMIN_PASSWORD: linkly_local
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:

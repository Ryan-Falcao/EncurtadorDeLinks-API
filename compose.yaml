services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: encurtador
      MYSQL_USER: encurtador
      MYSQL_PASSWORD: encurtador_local
      MYSQL_ROOT_PASSWORD: root_local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build:
      context: ./encurtador-url
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/encurtador?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: encurtador
      SPRING_DATASOURCE_PASSWORD: encurtador_local
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Senha apenas para testar o painel no seu computador.
      APP_ADMIN_PASSWORD: linkly_local
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:

services:
  api:
    build:
      context: ./encurtador-url
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Configure a URL do Aiven no arquivo .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Configure o usuário do Aiven no arquivo .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Configure a senha do Aiven no arquivo .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    restart: unless-stopped
